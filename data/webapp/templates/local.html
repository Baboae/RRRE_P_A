{% extends 'base.html' %}

{% block body %}
<div class="centered">
  <table class="local rel_inline padding_2_5 margin_5" >
    <thead class="dimmed">
    <tr>
      <th>NAME</th>
      <th>ELO</th>
      <th>SAFETY</th>
      <th>POS</th>
    </tr>
    </thead>
    <tbody class="dimmed">
    {% for user in users %}
    <tr>
        <td><a href="">{{ user["Fullname"] }}</a></td>
        <td>{{ user["Rating"] }}</td>
        <td>{{ user["Reputation"] }}</td>
        <td>{% if "Position" in user %}{{ user["Position"] }}{% else %} inactive {% endif %}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
