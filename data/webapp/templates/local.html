{% extends 'base.html' %}

{% block body %}
<div class="content_dimmed">
  <div class="local_users">
    <h1>LOCAL USERS:</h1>
    <ul>
    {% for user in users %}
      <li>
        {{ user["Fullname"] }}<br>
        ELO: {{ user["Rating"] }}<br>
        REP: {{ user["Reputation"] }}<br>
        Races completed: {{ user["RacesCompleted"] }}<br>
      </li>
      <br>
    {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
